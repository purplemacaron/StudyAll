<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyAll — 올인원 학습 워크스페이스</title>
<meta name="theme-color" content="#ffffff" id="metaTheme">
<link rel="apple-touch-icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="%230a0a0a"/><text x="256" y="352" font-family="Arial,Helvetica,sans-serif" font-size="290" font-weight="900" fill="%23ffffff" text-anchor="middle">S</text></svg>'>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js';document.head.appendChild(s);"></script>
<style>
:root{
  --bg:#ffffff; --fg:#0a0a0a; --muted:#707070;
  --line:#e6e6e3; --soft:#f6f6f4; --card:#ffffff;
  --inv-bg:#0a0a0a; --inv-fg:#ffffff;
  --hm0:#f1f1ef; --hm1:#d6d6d3; --hm2:#a8a8a5; --hm3:#5c5c5a; --hm4:#0a0a0a;
  --r-card:14px; --r-btn:10px;
}
[data-theme="dark"]{
  --bg:#0c0c0d; --fg:#f5f5f4; --muted:#8b8b8b;
  --line:#262626; --soft:#161617; --card:#111112;
  --inv-bg:#f5f5f4; --inv-fg:#0c0c0d;
  --hm0:#1b1b1c; --hm1:#2c2c2e; --hm2:#55555a; --hm3:#a8a8ad; --hm4:#f5f5f4;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg); color:var(--fg);
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
::selection{background:var(--fg);color:var(--bg)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
code{background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:.9em;font-family:ui-monospace,monospace}
svg.lucide{width:18px;height:18px;flex:none}
.ic-sm svg.lucide{width:15px;height:15px}
.ic-lg svg.lucide{width:24px;height:24px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;height:100dvh;overflow:hidden}
#sidebar{
  width:236px;flex:none;border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 14px;gap:4px;background:var(--bg);
}
.logo{padding:4px 8px 20px;display:flex;align-items:baseline;gap:2px}
.logo-word{font-weight:900;font-size:27px;letter-spacing:-1.3px;line-height:1;color:var(--fg)}
.logo-word em{font-style:normal;font-weight:500;color:var(--muted)}
.logo-word i{display:inline-block;width:6px;height:6px;background:var(--fg);border-radius:50%;margin-left:3px;transform:translateY(-2px)}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:var(--r-btn);
  color:var(--muted);font-weight:600;font-size:14.5px;transition:all .15s;text-align:left;
}
.nav-item:hover{background:var(--soft);color:var(--fg)}
.nav-item.active{background:var(--inv-bg);color:var(--inv-fg)}
.nav-item .chev{margin-left:auto;opacity:0;transition:opacity .15s}
.nav-item.active .chev{opacity:.6}
.nav-spacer{flex:1}
.side-streak{
  margin:10px 4px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-card);
  display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;
}
.side-streak small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}

#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{
  height:60px;flex:none;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 22px;background:var(--bg);
}
#topTitle{font-weight:800;font-size:17px;letter-spacing:-.4px}
#topDate{color:var(--muted);font-size:13px;font-weight:500}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
#menuBtn{display:none}
.mini-timer{
  display:none;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--fg);border-radius:999px;
  font-weight:800;font-size:13px;font-feature-settings:'tnum';cursor:pointer;
}
.mini-timer.on{display:flex}
.mini-timer .dot{width:7px;height:7px;border-radius:50%;background:var(--fg);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:all .15s}
.icon-btn:hover{background:var(--soft);color:var(--fg)}

#page{flex:1;overflow-y:auto;overflow-x:hidden}
.page-inner{max-width:1060px;margin:0 auto;padding:26px 24px 60px}
#page.no-scroll{overflow:hidden;display:flex;flex-direction:column}
#page.no-scroll .page-inner{display:flex;flex-direction:column;flex:1;min-height:0;max-width:1060px;padding:0 24px}
#page.enter .page-inner{animation:pageIn .35s cubic-bezier(.2,.7,.3,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

#tabbar{
  display:none;position:fixed;bottom:0;left:0;right:0;height:62px;z-index:60;
  background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
#tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:700;color:var(--muted);
}
#tabbar button.active{color:var(--fg)}
#sheet{position:fixed;inset:0;z-index:70;display:none}
#sheet.open{display:block}
#sheet .back{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet .panel{
  position:absolute;left:0;right:0;bottom:0;background:var(--bg);
  border-radius:20px 20px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom));
  animation:sheetUp .3s cubic-bezier(.2,.8,.3,1);
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sheet-grid button{
  border:1px solid var(--line);border-radius:12px;padding:14px 6px;display:flex;flex-direction:column;
  align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--fg);
}
.sheet-grid button.active{background:var(--inv-bg);color:var(--inv-fg)}
.sheet-handle{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px}
.card-strong{border:1.5px solid var(--fg)}
.invert{background:var(--inv-bg);color:var(--inv-fg)}
.muted-t{color:var(--muted)}
.card h3{font-size:15px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.card h3 .ic-sm{color:var(--muted)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 18px;border:1.5px solid var(--fg);border-radius:var(--r-btn);
  font-weight:700;font-size:14px;background:var(--card);transition:all .15s;
}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn-solid{background:var(--inv-bg);color:var(--inv-fg)}
.btn-solid:hover{opacity:.85}
.btn-ghost{border-color:var(--line);color:var(--fg)}
.btn-ghost:hover{border-color:var(--fg);background:var(--soft);color:var(--fg)}
.btn-sm{padding:7px 13px;font-size:13px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-danger{border-color:var(--fg)}
.btn-danger:hover{background:var(--fg);color:var(--bg)}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.input,.select,.textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--r-btn);
  background:var(--bg);transition:border-color .15s;font-size:14px;
}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--fg)}
.textarea{resize:vertical;min-height:110px;line-height:1.6}
.seg{display:inline-flex;border:1.5px solid var(--fg);border-radius:var(--r-btn);overflow:hidden;flex-wrap:wrap}
.seg button{padding:8px 16px;font-weight:700;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button.active{background:var(--inv-bg);color:var(--inv-fg)}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border:1px solid var(--line);
  border-radius:999px;font-size:12px;font-weight:700;color:var(--muted);
}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
  background:var(--inv-bg);color:var(--inv-fg);font-size:11px;font-weight:800;
}
.row-list{display:flex;flex-direction:column}
.row-item{
  display:flex;align-items:center;gap:13px;padding:14px 4px;border-bottom:1px solid var(--line);
  cursor:pointer;transition:padding .15s;
}
.row-item:last-child{border-bottom:none}
.row-item:hover{padding-left:10px}
.row-ic{width:38px;height:38px;border:1.5px solid var(--fg);border-radius:11px;display:grid;place-items:center;flex:none}
.row-txt{min-width:0}
.row-txt b{font-size:14.5px;display:block;letter-spacing:-.2px}
.row-txt span{font-size:12.5px;color:var(--muted)}
.row-item .chev{margin-left:auto;color:var(--muted)}

.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty svg.lucide{width:34px;height:34px;opacity:.5;margin-bottom:12px}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:5px}
.empty p{font-size:13px;line-height:1.6}

.section-title{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:26px;font-weight:800;letter-spacing:-.8px}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:5px}

.notice{
  display:flex;align-items:center;gap:12px;padding:13px 16px;border:1.5px dashed var(--fg);
  border-radius:var(--r-card);margin-bottom:20px;font-size:13.5px;font-weight:600;flex-wrap:wrap;
}
.notice .btn{margin-left:auto}
.notice .note-sub{flex-basis:100%;font-weight:500;color:var(--muted);font-size:12.5px;line-height:1.6}

.home-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
.hero{padding:26px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.hero .hi{font-size:13px;font-weight:700;opacity:.65;letter-spacing:.02em}
.hero .big-clock{
  position:absolute;top:22px;right:24px;text-align:right;font-feature-settings:'tnum';
  font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1;
}
.hero .big-clock small{display:block;font-size:11px;font-weight:600;opacity:.55;margin-top:5px;letter-spacing:.05em}
.hero .streak-num{font-size:clamp(48px,7vw,72px);font-weight:900;letter-spacing:-3px;line-height:1.05;display:flex;align-items:center;gap:12px}
.hero .streak-num svg.lucide{width:.7em;height:.7em}
.hero .hero-stats{display:flex;gap:22px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(128,128,128,.3)}
.hero .hero-stats div b{font-size:17px;display:block;font-weight:900;font-feature-settings:'tnum'}
.hero .hero-stats div span{font-size:11.5px;opacity:.6;font-weight:600}
.todo-mini .row-item{cursor:default}
.todo-mini .row-item:hover{padding-left:4px}
.check{
  width:22px;height:22px;border:1.5px solid var(--fg);border-radius:7px;flex:none;
  display:grid;place-items:center;transition:all .15s;color:transparent;
}
.check:hover{background:var(--soft)}
.check.on{background:var(--inv-bg);color:var(--inv-fg)}
.done-txt{text-decoration:line-through;color:var(--muted)}
.qa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.qa-grid button{
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;
  border:1px solid var(--line);border-radius:12px;font-size:12px;font-weight:700;color:var(--fg);transition:all .15s;
}
.qa-grid button:hover{border-color:var(--fg);background:var(--soft)}
.qa-grid svg.lucide{width:20px;height:20px}

.chat-layout{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;padding:16px 0 0}
.chat-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex:none;flex-wrap:wrap}
.chat-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px 2px 18px}
.msg{max-width:76%;padding:12px 16px;border-radius:16px;font-size:14.5px;line-height:1.65;word-break:keep-all}
.msg.ai,.msg.assistant{align-self:flex-start;border:1.5px solid var(--line);border-top-left-radius:5px;background:var(--card)}
.msg.user{align-self:flex-end;background:var(--inv-bg);color:var(--inv-fg);border-top-right-radius:5px}
.msg .demo-tag{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:800;letter-spacing:.06em;opacity:.55;text-transform:uppercase}
.msg pre.code{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:8px 0;white-space:pre-wrap;font-size:12.5px;font-family:ui-monospace,monospace;overflow-x:auto}
.msg code{border-radius:5px}
.msg strong{font-weight:800}
.chat-inputbar{flex:none;display:flex;gap:10px;padding:12px 0 16px}
.chat-inputbar .input{flex:1;border-radius:999px;padding:13px 20px}
.send-btn{width:48px;height:48px;border-radius:50%;background:var(--inv-bg);color:var(--inv-fg);display:grid;place-items:center;flex:none;transition:opacity .15s}
.send-btn:hover{opacity:.85}
.typing-dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:4px;animation:pulse 1s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}

.tool-result{border-top:1.5px solid var(--fg);margin-top:22px;padding-top:20px}
.tool-result h4{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.kw-list{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.q-preview{border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px}
.q-preview b{font-size:14px;display:block;margin-bottom:9px}
.q-preview .choice{font-size:13px;padding:6px 10px;border-radius:8px;color:var(--muted)}
.q-preview .choice.correct{background:var(--inv-bg);color:var(--inv-fg);font-weight:700}
.q-preview .exp{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.55}
.plan-item{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.plan-item:last-child{border:none}
.plan-item .ph{font-weight:800;font-size:14px;width:96px;flex:none;letter-spacing:-.3px}
.plan-item ul{list-style:none}
.plan-item li{font-size:13.5px;color:var(--muted);padding:2.5px 0;display:flex;gap:8px;align-items:center}
.plan-item li::before{content:"";width:5px;height:5px;background:var(--fg);border-radius:1px;flex:none}

.deck-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.deck-card{padding:20px;display:flex;flex-direction:column;gap:14px;transition:border-color .15s}
.deck-card:hover{border-color:var(--fg)}
.deck-card .dn{font-weight:800;font-size:16.5px;letter-spacing:-.4px}
.deck-card .dm{display:flex;gap:6px;flex-wrap:wrap}
.add-inline{display:flex;gap:8px;flex-wrap:wrap}
.add-inline .input{flex:1;min-width:140px}
.fc-scene{perspective:1400px;height:min(340px,46dvh);cursor:pointer}
.fc-card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.8,.3,1)}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1.5px solid var(--fg);border-radius:18px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:30px;text-align:center;gap:12px;
}
.fc-face.back{transform:rotateY(180deg);background:var(--inv-bg);color:var(--inv-fg)}
.fc-face .fc-label{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.45}
.fc-face .fc-text{font-size:clamp(18px,3vw,25px);font-weight:800;letter-spacing:-.5px;line-height:1.4;word-break:keep-all}
.fc-face .fc-hint{font-size:12px;opacity:.5;font-weight:600;margin-top:auto}
.study-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}

.quiz-choices{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.choice-btn{
  text-align:left;padding:14px 17px;border:1.5px solid var(--line);border-radius:12px;
  font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:12px;transition:all .15s;background:var(--card);
}
.choice-btn:hover:not(:disabled){border-color:var(--fg)}
.choice-btn .ci{
  width:26px;height:26px;border:1.5px solid currentColor;border-radius:8px;flex:none;
  display:grid;place-items:center;font-size:12px;font-weight:800;
}
.choice-btn.correct{border-color:var(--fg);background:var(--inv-bg);color:var(--inv-fg)}
.choice-btn.wrong{color:var(--muted);text-decoration:line-through}
.choice-btn:disabled{cursor:default}
.q-explain{margin-top:16px;padding:14px 16px;border:1px dashed var(--fg);border-radius:12px;font-size:13.5px;line-height:1.6;color:var(--muted)}
.q-explain b{color:var(--fg)}
.score-hero{text-align:center;padding:40px 20px}
.score-hero .sn{font-size:64px;font-weight:900;letter-spacing:-3px;font-feature-settings:'tnum'}
.score-hero .sn small{font-size:22px;color:var(--muted);letter-spacing:0}

.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 0 10px}
.ring-box{position:relative;width:min(300px,72vw);height:min(300px,72vw)}
.ring-box svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:7}
.ring-fg{fill:none;stroke:var(--fg);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ring-center .t{font-size:clamp(44px,9vw,58px);font-weight:900;letter-spacing:-2px;font-feature-settings:'tnum';line-height:1}
.ring-center .m{font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.timer-controls{display:flex;gap:10px;margin-top:20px;align-items:center}
.t-main{width:66px;height:66px;border-radius:50%;background:var(--inv-bg);color:var(--inv-fg);display:grid;place-items:center}
.t-main:hover{opacity:.85}
.t-sub{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--fg);display:grid;place-items:center}
.t-sub:hover{background:var(--fg);color:var(--bg)}
.duration-pill{display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--line);border-radius:999px;padding:4px 6px}
.duration-pill button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.duration-pill button:hover{background:var(--soft)}
.duration-pill b{min-width:52px;text-align:center;font-size:13px;font-feature-settings:'tnum'}
.timer-meta{display:flex;gap:26px;margin-top:18px}
.timer-meta div{text-align:center}
.timer-meta b{display:block;font-size:19px;font-weight:900;font-feature-settings:'tnum'}
.timer-meta span{font-size:11.5px;color:var(--muted);font-weight:700}

.notes-grid{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.note-item{padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.note-item:hover{border-color:var(--fg)}
.note-item.active{background:var(--inv-bg);color:var(--inv-fg)}
.note-item.active .muted-t{color:var(--muted)}
.note-item b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}

<script>
/* =========================================================
   StudyAll — 단일 파일 학습 워크스페이스

function icons(){ try{ window.lucide && window.lucide.createIcons(); }catch(e){} }
(function waitIcons(){ var n=0; var t=setInterval(function(){ if(window.lucide){ icons(); clearInterval(t); } else if(++n>80) clearInterval(t); },250); })();
window.addEventListener('load', icons);

/* ---------- 상태 ---------- */
var STORE_KEY = 'studyall.v1';
var DEFAULTS = {
  v:1, theme:'light', apiKey:'', model:'llama-3.3-70b-versatile',
  decks:[], quizzes:[], notes:[], todos:[], sessions:[], chat:[],
  pomo:{ work:25, rest:5, subject:'' },
  quizStats:{ played:0, correct:0 },
};
var state = (function(){
  try{
    var s = JSON.parse(localStorage.getItem(STORE_KEY));
    return Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), s||{});
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULTS)); }
})();
function save(){

  catch(e){ toast('저장 실패 — 브라우저 저장소가 제한되어 있을 수 있어요','alert-triangle'); }
}

var uid = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); };
function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }

var NAV = [
  {id:'home',    name:'홈',        icon:'home'},

  ['llama-3.1-8b-instant','Llama 3.1 8B — 초고속'],

/* ---------- 유틸 ---------- */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function md(s){
  var h = esc(s); var pres=[];
  h = h.replace(/```([\s\S]*?)```/g,function(m,c){ pres.push(c.replace(/^\w*\n/,'')); return '\u0000'+(pres.length-1)+'\u0000'; });
  h = h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  h = h.replace(/^#{1,4}\s*(.+)$/gm,'<strong>$1</strong>');
  h = h.replace(/^[-*]\s+(.+)$/gm,'&bull; $1');
  h = h.replace(/\n/g,'<br>');
  return h.replace(/\u0000(\d+)\u0000/g,function(m,i){ return '<pre class="code">'+pres[i]+'</pre>'; });
}
function pad2(n){ return String(n).padStart(2,'0'); }
function todayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function weekStart(d){ d=d||new Date(); var x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function fmtMin(m){ m=Math.round(m); if(m<60) return m+'분'; var h=Math.floor(m/60), r=m%60; return h+'시간'+(r?' '+r+'분':''); }
function shuffle(a){ var x=a.slice(); for(var i=x.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=x[i]; x[i]=x[j]; x[j]=t; } return x; }
function extractJSON(s){
  s = String(s).replace(/```json|```/g,'').trim();
  var a=s.indexOf('{'), b=s.lastIndexOf('}');
  if(a<0||b<0) throw new Error('응답에서 JSON을 찾을 수 없습니다');
  return JSON.parse(s.slice(a,b+1));
}
function subjects(){
  var s = {};
  state.todos.forEach(function(t){ if(t.subject) s[t.subject]=1; });
  state.sessions.forEach(function(x){ if(x.subject) s[x.subject]=1; });
  return Object.keys(s);
}
function minutesOn(key){ return state.sessions.filter(function(s){ return s.date===key; }).reduce(function(a,s){ return a+s.minutes; },0); }
function calcStreak(){
  var set = {}; state.sessions.forEach(function(s){ if(s.minutes>0) set[s.date]=1; });
  var d = new Date(); if(!set[todayKey(d)]) d = addDays(d,-1);
  var n=0; while(set[todayKey(d)]){ n++; d=addDays(d,-1); } return n;
}
function beep(times){
  times=times||3;
  try{
    var Ctx = window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    var ctx = new Ctx();
    for(var i=0;i<times;i++){
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type='sine'; o.frequency.value=880;
      var t0=ctx.currentTime+i*0.35;
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.18,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.3);
      o.start(t0); o.stop(t0+0.32);
    }
    setTimeout(function(){ try{ctx.close();}catch(e){} }, times*400+500);
  }catch(e){}
}

/* ---------- 토스트 / 모달 ---------- */
function toast(msg, icon){
  var t = document.createElement('div');
  t.className='toast'; t.innerHTML = '<i data-lucide="'+(icon||'check')+'"></i><span>'+esc(msg)+'</span>';
  $('#toastRoot').appendChild(t); icons();
  setTimeout(function(){ t.classList.add('out'); setTimeout(function(){ t.remove(); },260); }, 3000);
}
function openModal(opt){
  var root = $('#modalRoot');
  root.innerHTML = '<div class="modal-back"><div class="modal '+(opt.wide?'wide':'')+'">'
    +'<div class="modal-head"><h3>'+opt.title+'</h3><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>'
    +'<div class="modal-body">'+opt.body+'</div>'
    +(opt.footer?'<div class="modal-foot">'+opt.footer+'</div>':'')
    +'</div></div>';
  root.classList.add('open'); icons();
  root.querySelector('.modal-back').addEventListener('click', function(e){ if(e.target===e.currentTarget) closeModal(); });
  root.querySelector('[data-close]').addEventListener('click', closeModal);
  if(opt.onOpen) opt.onOpen(root);
  return root;
}
function closeModal(){ var r=$('#modalRoot'); r.classList.remove('open'); r.innerHTML=''; }
function askConfirm(msg, okLabel, danger){
  return new Promise(function(res){
    openModal({
      title: danger?'정말 실행할까요?':'확인',
      body:'<p style="font-size:14px;line-height:1.7;color:var(--muted)">'+esc(msg)+'</p>',
      footer:'<button class="btn btn-ghost" data-no>취소</button>'
        +'<button class="btn '+(danger?'btn-danger':'btn-solid')+'" data-yes>'+esc(okLabel||'확인')+'</button>',
      onOpen: function(root){
        root.querySelector('[data-no]').onclick = function(){ closeModal(); res(false); };
        root.querySelector('[data-yes]').onclick = function(){ closeModal(); res(true); };
      }
    });
  });
}
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ closeModal(); $('#sheet').classList.remove('open'); } });

/* ---------- Groq AI ---------- */
var GROQ_URL = 'https://api.groq.com/openai/v1/chat/completions';
var SYS_PROMPT = '당신은 학습 앱 "StudyAll"의 AI 튜터입니다. 항상 한국어로 답변하세요. 개념을 단계별로, 예시와 비유를 들어 명확하게 설명하고, 필요하면 확인용 문제를 던지세요. 간결하지만 핵심을 놓치지 마세요.';

async function groqChat(messages, opt){
  opt = opt||{};
  if(!state.apiKey){ var e=new Error('API 키가 설정되지 않았어요'); e.code='NO_KEY'; throw e; }
  var body = { model: state.model, messages: messages, temperature: (opt.temperature!=null?opt.temperature:0.7) };
  if(opt.json) body.response_format = { type:'json_object' };
  if(opt.onDelta) body.stream = true;
  var res = await fetch(GROQ_URL, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+state.apiKey },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    var err={}; try{ err = await res.json(); }catch(e){}
    throw new Error((err.error&&err.error.message) || ('요청 실패 (HTTP '+res.status+')'));
  }
  if(!opt.onDelta){ var d = await res.json(); return d.choices[0].message.content; }
  var reader = res.body.getReader(); var dec = new TextDecoder();
  var buf='', full='';
  for(;;){
    var chunk = await reader.read(); if(chunk.done) break;
    buf += dec.decode(chunk.value, {stream:true});
    var lines = buf.split('\n'); buf = lines.pop();
    for(var i=0;i<lines.length;i++){
      var t = lines[i].trim(); if(t.indexOf('data:')!==0) continue;
      var data = t.slice(5).trim(); if(data==='[DONE]') continue;
      try{
        var j = JSON.parse(data);
        var delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
        if(delta){ full += delta; opt.onDelta(full); }
      }catch(e){}
    }
  }
  return full;
}

function demoChatReply(text){
  if(/안녕|하이|hello/i.test(text)) return '안녕하세요! StudyAll AI 튜터예요. 지금은 **오프라인 데모 모드**라 미리 준비된 답변만 드릴 수 있어요.\n\n설정에서 Groq API 키를 입력하면 어떤 질문이든 실시간으로 답해드립니다. 무료 키는 console.groq.com에서 발급할 수 있어요.';
  if(/퀴즈|문제|시험/.test(text)) return '좋아요, 문제 하나 볼게요!\n\n**Q. 다음 중 효율적인 암기 전략은?**\n1. 밤새 한 번에 몰아 읽기\n2. 간격을 두고 여러 번 복습하기\n3. 읽기만 하고 확인하지 않기\n\n정답은 2번! **간격 반복(spaced repetition)**이 장기 기억에 가장 효과적입니다. AI 도구 탭에서 퀴즈 자동 생성도 활용해 보세요.';
  if(/포모도로|집중|타이머/.test(text)) return '포모도로 기법은 **25분 집중 + 5분 휴식**을 반복하는 방식이에요. 포모도로 탭에서 바로 시작할 수 있고, 완료한 세션은 자동으로 통계에 기록됩니다.';
  return '좋은 질문이네요 — "'+(text.length>30?text.slice(0,30)+'…':text)+'"에 대해 깊이 답하고 싶지만, 지금은 **오프라인 데모 모드**라 실제 AI 추론이 불가능합니다.\n\n**설정 → AI 연결**에서 무료 Groq API 키를 입력하면 이 질문에 즉시 답해드릴 수 있어요.';
}
function demoTool(kind, topic){
  topic = topic || '학습 주제';
  if(kind==='quiz') return { questions:[
    {question:"'"+topic+"'의 핵심을 가장 잘 설명한 것은?", choices:['기본 개념과 원리를 다루는 주제이다','오직 계산만 다루는 주제이다','외울 필요가 전혀 없는 주제이다','위 모두 정답이다'], answer:0, explanation:'(데모) 실제 AI 키를 연결하면 주제에 맞는 진짜 문제가 생성됩니다.'},
    {question:"'"+topic+"'을(를) 학습할 때 가장 효과적인 방법은?", choices:['한 번 훑고 끝내기','간격을 두고 반복 복습하기','새벽에 몰아서 보기','필기하지 않기'], answer:1, explanation:'간격 반복이 장기 기억 형성에 가장 효과적입니다.'},
    {question:"다음 중 '"+topic+"'과(와) 직접 관련이 없는 것은?", choices:['개념 이해','예제 풀이','핵심 용어 정리','전혀 다른 과목 성적 산출'], answer:3, explanation:'성적 산출은 학습 내용과 무관합니다.'},
  ]};
  if(kind==='cards') return { cards:[
    {front:topic+'의 정의는?', back:'(데모) 실제 AI 키를 연결하면 주제에 맞는 정의가 생성됩니다.'},

var chatBusy=false;
var page_tutor = function(root){
  $('#page').classList.add('no-scroll');
  root.innerHTML = ''
  +'<div class="chat-layout">'
  +'  <div class="chat-toolbar">'
  +'    <span class="chip">'+(state.apiKey? 'Groq · '+esc(state.model) : '오프라인 데모 모드')+'</span>'
  +'    <button class="btn btn-ghost btn-sm" id="clrChat"><i data-lucide="trash-2"></i>대화 지우기</button>'
  +'  </div>'
  +( !state.apiKey
    ? '<div class="notice" style="margin-bottom:10px"><i data-lucide="key-round"></i>데모 모드: 샘플 답변만 제공됩니다.<button class="btn btn-sm" data-go="settings">키 연결하기</button></div>'
    : '' )
  +'  <div class="chat-scroll" id="chatScroll"></div>'
  +'  <div class="chat-inputbar">'
  +'    <input class="input" id="chatInput" placeholder="질문을 입력하세요… (Enter 전송)" autocomplete="off">'
  +'    <button class="send-btn" id="chatSend"><i data-lucide="send"></i></button>'
  +'  </div>'
  +'</div>';
  root.querySelector('[data-go="settings"]') && root.querySelector('[data-go="settings"]').addEventListener('click', function(){ go('settings'); });

  var scroll = $('#chatScroll');
  function bubble(role, html){
    var d = document.createElement('div');
    d.className = 'msg '+role;
    d.innerHTML = '<div class="msg-body">'+html+'</div>';
    scroll.appendChild(d); scroll.scrollTop = scroll.scrollHeight; return d;
  }
  function renderHistory(){
    scroll.innerHTML='';
    if(state.chat.length===0){
      scroll.innerHTML = '<div class="empty" style="margin:auto"><i data-lucide="bot"></i><b>무엇이든 물어보세요</b></div>';
      icons(); return;
    }
    state.chat.forEach(function(m){ bubble(m.role==='user'?'user':'ai', md(m.content)); });
  }
  renderHistory();

  $('#clrChat').onclick = async function(){
    if(!state.chat.length) return;
    if(await askConfirm('대화를 모두 지울까요?','지우기',true)){ state.chat=[]; save(); renderHistory(); }
  };

  async function send(){
    if(chatBusy) return;
    var inp = $('#chatInput'); var text = inp.value.trim(); if(!text) return;
    inp.value=''; chatBusy=true; $('#chatSend').style.opacity=.4;
    var emp = scroll.querySelector('.empty'); if(emp) emp.remove();
    state.chat.push({role:'user', content:text}); save();
    bubble('user', md(text));
    var aiEl = bubble('ai', '<span class="typing-dots"><span></span><span></span><span></span></span>');
    var bodyEl = aiEl.querySelector('.msg-body');

    if(!state.apiKey){
      await sleep(650);
      bodyEl.innerHTML = md(demoChatReply(text));
      scroll.scrollTop = scroll.scrollHeight;
      chatBusy=false; $('#chatSend').style.opacity=1; return;
    }
    try{
      var msgs = [{role:'system', content:SYS_PROMPT}].concat(state.chat.slice(-20));
      var full = await groqChat(msgs, { onDelta: function(acc){
        bodyEl.innerHTML = md(acc); scroll.scrollTop = scroll.scrollHeight;
      }});
      state.chat.push({role:'assistant', content:full});
      if(state.chat.length>60) state.chat = state.chat.slice(-60);
      save();
    }catch(e){
      bodyEl.innerHTML = '<strong>응답을 받지 못했어요.</strong><br>'+esc(e.message)+'<br><br>설정에서 API 키와 모델 ID를 확인해 주세요.';
    }
    scroll.scrollTop = scroll.scrollHeight;
    chatBusy=false; $('#chatSend').style.opacity=1; icons();
  }
  $('#chatSend').addEventListener('click', send);
  $('#chatInput').addEventListener('keydown', function(e){ if(e.key==='Enter'&&!e.isComposing) send(); });
  icons();
};

var studyS=null;
function startStudy(deckId){
  var deck = state.decks.find(function(d){ return d.id===deckId; });
  if(!deck || deck.cards.length===0){ toast('학습할 카드가 없어요','alert-triangle'); return; }
  studyS = { deck:deck, queue:shuffle(deck.cards.map(function(c){ return c.id; })), done:0, again:0, total:deck.cards.length, flipped:false };
  renderStudyOverlay();
}
function renderStudyOverlay(){
  var ov = $('#studyOverlay'); ov.classList.add('open');
  if(studyS.queue.length===0){
    var acc = studyS.total ? Math.round((studyS.total-studyS.again)/studyS.total*100) : 0;
    ov.innerHTML = '<div class="study-inner" style="justify-content:center;text-align:center">'
      +'<div class="score-hero" style="padding:0">'
      +'<div class="muted-t" style="font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase">복습 완료</div>'
      +'<div class="sn">'+acc+'<small>%</small></div>'
      +'<p class="muted-t" style="margin-top:8px">알아요 '+(studyS.total-studyS.again)+' · 다시 볼 카드 '+studyS.again+'</p></div>'
      +'<div class="study-actions">'
      +'<button class="btn btn-ghost" id="sClose"><i data-lucide="x"></i>닫기</button>'
      +'<button class="btn btn-solid" id="sAgain"><i data-lucide="rotate-ccw"></i>다시 학습</button>'
      +'</div></div>';
    $('#sClose').onclick = closeStudy;
    $('#sAgain').onclick = function(){ startStudy(studyS.deck.id); };
    icons(); return;
  }
  var card = studyS.deck.cards.find(function(c){ return c.id===studyS.queue[0]; });
  if(!card){ closeStudy(); return; }
  ov.innerHTML = '<div class="study-inner">'
    +'<div class="study-top">'
    +'<button class="icon-btn" id="sClose"><i data-lucide="x"></i></button>'
    +'<div class="study-prog"><i style="width:'+Math.round(studyS.done/studyS.total*100)+'%"></i></div>'
    +'<span class="study-count">'+studyS.done+' / '+studyS.total+'</span></div>'
    +'<div class="fc-scene" id="fcScene">'
    +'<div class="fc-card '+(studyS.flipped?'flipped':'')+'" id="fcCard">'
    +'<div class="fc-face"><div class="fc-label">Question</div><div class="fc-text">'+esc(card.front)+'</div><div class="fc-hint">카드를 눌러 뒤집기</div></div>'
    +'<div class="fc-face back"><div class="fc-label">Answer</div><div class="fc-text">'+esc(card.back)+'</div><div class="fc-hint">기억됐나요?</div></div>'
    +'</div></div>'
    +'<div class="study-actions">'
    +'<button class="btn" id="btnAgain" style="display:'+(studyS.flipped?'':'none')+'"><i data-lucide="rotate-ccw"></i>다시 볼래요</button>'
    +'<button class="btn btn-solid" id="btnKnow" style="display:'+(studyS.flipped?'':'none')+'"><i data-lucide="check"></i>알아요</button>'
    +'</div></div>';
  icons();
  $('#sClose').onclick = closeStudy;
  $('#fcScene').onclick = function(){ studyS.flipped=!studyS.flipped; renderStudyOverlay(); };
  $('#btnAgain').onclick = function(e){
    e.stopPropagation();
    var cur = studyS.queue.shift(); studyS.queue.push(cur);
    var c = studyS.deck.cards.find(function(x){ return x.id===cur; }); if(c) c.box=0;
    studyS.again++; studyS.flipped=false; save(); renderStudyOverlay();
  };
  $('#btnKnow').onclick = function(e){
    e.stopPropagation();
    var cur = studyS.queue.shift();
    var c = studyS.deck.cards.find(function(x){ return x.id===cur; }); if(c) c.box = Math.min(2, c.box+1);
    studyS.done++; studyS.flipped=false; save(); renderStudyOverlay();
  };
}
function closeStudy(){ $('#studyOverlay').classList.remove('open'); studyS=null; route(); }

function renderQuizPlay(root){
  var p = qPlay, quiz = p.quiz, qs = quiz.questions;
  if(p.idx >= p.order.length){
    var n = qs.length, acc = Math.round(p.correct/n*100);
    if(!p.counted){ state.quizStats.played += n; state.quizStats.correct += p.correct; p.counted=true; save(); }
    var wrongHtml = '';
    if(p.correct<n){
      wrongHtml = '<div class="section-title">틀린 문제 복습</div><div class="card">'
        + qs.map(function(q,i){
            if(p.result[i]) return '';
            return '<div class="q-preview"><b>'+esc(q.question)+'</b>'
              +'<div class="choice correct">'+esc(q.choices[q.answer])+' ✓</div>'
              +(q.explanation?'<div class="exp">해설 · '+esc(q.explanation)+'</div>':'')
              +'</div>';
          }).join('')+'</div>';
    }
    root.innerHTML = '<div class="card card-strong score-hero">'
      +'<div class="muted-t" style="font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase">'+esc(quiz.title)+' 결과</div>'
      +'<div class="sn">'+p.correct+'<small> / '+n+'</small></div>'
      +'<p class="muted-t" style="margin:6px 0 18px">정답률 '+acc+'%</p>'
      +'<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'
      +'<button class="btn" id="qRetry"><i data-lucide="rotate-ccw"></i>다시 풀기</button>'
      +'<button class="btn btn-solid" id="qExit"><i data-lucide="list"></i>목록으로</button>'
      +'</div></div>'+wrongHtml;
    $('#qRetry').onclick = function(){ qPlay={quiz:quiz, idx:0, correct:0, picked:null, order:shuffle(qs.map(function(_,i){ return i; })), result:{}, counted:false}; route(); };
    $('#qExit').onclick = function(){ qPlay=null; route(); };
    icons(); return;
  }
  var qi = p.order[p.idx], q = qs[qi];
  root.innerHTML = '<div class="card card-strong" style="padding:26px">'
    +'<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px">'
    +'<span class="badge">'+(p.idx+1)+' / '+p.order.length+'</span>'
    +'<span class="chip">'+esc(quiz.title)+'</span>'
    +'<button class="icon-btn" id="qQuit" style="margin-left:auto"><i data-lucide="x"></i></button></div>'
    +'<h2 style="font-size:20px;font-weight:800;letter-spacing:-.5px;line-height:1.5;word-break:keep-all">'+esc(q.question)+'</h2>'
    +'<div class="quiz-choices">'
    + q.choices.map(function(c,i){
        var cls='choice-btn';
        if(p.picked!==null){
          if(i===q.answer) cls+=' correct';
          else if(i===p.picked) cls+=' wrong';
        }
        return '<button class="'+cls+'" data-pick="'+i+'" '+(p.picked!==null?'disabled':'')+'>'
          +'<span class="ci">'+'ABCD'[i]+'</span>'+esc(c)
          +(p.picked!==null&&i===q.answer?'<i data-lucide="check" style="margin-left:auto"></i>':'')
          +(p.picked===i&&i!==q.answer?'<i data-lucide="x" style="margin-left:auto"></i>':'')
          +'</button>';
      }).join('')
    +'</div>'
    +(p.picked!==null && q.explanation ? '<div class="q-explain"><b>해설</b> · '+esc(q.explanation)+'</div>' : '')
    +(p.picked!==null
      ? '<button class="btn btn-solid" id="qNext" style="margin-top:18px;width:100%">'
        +(p.idx+1<p.order.length?'다음 문제':'결과 보기')+' <i data-lucide="arrow-right"></i></button>' : '')
    +'</div>';
  $('#qQuit').onclick = function(){ qPlay=null; route(); };
  root.querySelectorAll('[data-pick]').forEach(function(b){
    b.onclick = function(){
      if(p.picked!==null) return;
      p.picked = Number(b.dataset.pick);
      p.result[qi] = (p.picked===q.answer);
      if(p.picked===q.answer) p.correct++;
      route();
    };
  });
  var nx = $('#qNext');
  if(nx) nx.addEventListener('click', function(){ p.idx++; p.picked=null; route(); });
  icons();
}

function openQuizBuilder(){
  openModal({ title:'퀴즈 직접 만들기', wide:true,
    body:'<div class="field"><label>퀴즈 제목</label><input class="input" id="qzTitle" placeholder="예: 생물 2과 단원 테스트"></div>'
      +'<div id="qzBlocks"></div>'
      +'<button class="btn btn-ghost btn-sm" id="qzAdd"><i data-lucide="plus"></i>문제 추가</button>',
    footer:'<button class="btn btn-solid" id="qzSave">저장</button>',
    onOpen: function(m){
      var blocks = m.querySelector('#qzBlocks');
      function addBlock(){
        var b = document.createElement('div');
        b.className='q-preview'; b.style.marginBottom='10px';
        b.innerHTML = '<input class="input" placeholder="문제를 입력하세요" style="margin-bottom:8px">'
          +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px">'
          +'<input class="input c1" placeholder="선택지 1"><input class="input c2" placeholder="선택지 2">'
          +'<input class="input c3" placeholder="선택지 3"><input class="input c4" placeholder="선택지 4"></div>'
          +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
          +'<label style="font-size:12px;font-weight:700;color:var(--muted)">정답</label>'
          +'<select class="select ans" style="width:80px;padding:7px 9px"><option>1</option><option>2</option><option>3</option><option>4</option></select>'
          +'<input class="input exp" placeholder="해설 (선택)" style="flex:1;min-width:120px">'
          +'<button class="icon-btn ic-sm" data-rm><i data-lucide="trash-2"></i></button></div>';
        b.querySelector('[data-rm]').onclick = function(){ b.remove(); };
        blocks.appendChild(b); icons();
      }
      addBlock();
      m.querySelector('#qzAdd').onclick = addBlock;
      m.querySelector('#qzSave').onclick = function(){
        var title = m.querySelector('#qzTitle').value.trim() || '내 퀴즈';
        var questions = [];
        blocks.querySelectorAll('.q-preview').forEach(function(b){
          var q = b.querySelector('input').value.trim();
          var cs = ['c1','c2','c3','c4'].map(function(cl){ return b.querySelector('.'+cl).value.trim(); });
          var ans = Number(b.querySelector('.ans').value)-1;
          var exp = b.querySelector('.exp').value.trim();
          if(!q || cs.some(function(c){ return !c; })) return;
          questions.push({question:q, choices:cs, answer:ans, explanation:exp});
        });
        if(!questions.length){ toast('문제를 완성해 주세요','alert-triangle'); return; }
        state.quizzes.unshift({id:uid(), title:title, questions:questions}); save();
        closeModal(); toast('퀴즈 저장 완료 — 바로 풀어보세요!'); route();
      };
    }});
}

/* ---------- 포모도로 ---------- */
var pomo = { mode:'work', running:false, endAt:0, left:0 };
function pomoTotal(){ return (pomo.mode==='work'? state.pomo.work : state.pomo.rest) * 60; }
function pomoShown(){
  var total = pomoTotal();
  return Math.max(0, pomo.running ? pomo.left : (pomo.left>0 ? pomo.left : total));
}
function pomoReset(){ pomo.running=false; pomo.left=pomoTotal(); updatePomoUI(); }
function pomoToggle(){
  if(pomo.running){
    pomo.left = Math.max(0, Math.round((pomo.endAt - Date.now())/1000));
    pomo.running=false;
  }else{
    if(!(pomo.left>0)) pomo.left = pomoTotal();
    pomo.endAt = Date.now() + pomo.left*1000; pomo.running=true;
  }
  updatePomoUI();
}
function pomoSkip(){ pomo.mode = pomo.mode==='work' ? 'rest':'work'; pomoReset(); }
function pomoFinish(){
  pomo.running=false; beep(3);
  if(pomo.mode==='work'){
    addStudy(state.pomo.subject, state.pomo.work);
    toast('집중 '+state.pomo.work+'분 완료! 휴식을 즐기세요','flame');
    pomo.mode='rest';
  }else{
    toast('휴식 끝! 다시 집중해요','zap');
    pomo.mode='work';
  }
  pomoReset();
}
setInterval(function(){
  if(!pomo.running) return;
  pomo.left = Math.max(0, Math.round((pomo.endAt - Date.now())/1000));
  if(pomo.left<=0){ pomoFinish(); return; }
  updatePomoUI();
}, 400);

function updatePomoUI(){
  var total = pomoTotal(), shown = pomoShown();
  var mt = $('#miniTimer');
  if(mt){
    if(pomo.running){
      mt.classList.add('on');
      $('#miniTimerTxt').textContent = (pomo.mode==='work'?'집중':'휴식')+' '+pad2(Math.floor(shown/60))+':'+pad2(shown%60);
    } else mt.classList.remove('on');
  }
  if(currentRoute!=='timer') return;
  var tEl = $('#pomoTime'); if(!tEl) return;
  tEl.textContent = pad2(Math.floor(shown/60))+':'+pad2(shown%60);
  var ring = $('#ringFg');
  if(ring){ var C = 2*Math.PI*130; ring.style.strokeDashoffset = C*(1-(total-shown)/total); }
  var lbl = $('#pomoMode'); if(lbl) lbl.textContent = pomo.mode==='work'?'Focus · 집중':'Break · 휴식';
  var st = $('#pomoState'); if(st) st.textContent = pomo.running?'Running':'Ready';
  var btn = $('#pomoMain'); if(btn){ btn.innerHTML = '<i data-lucide="'+(pomo.running?'pause':'play')+'"></i>'; icons(); }
}

var activeNoteId=null, noteSearch='', noteSaveT=null;
var page_notes = function(root){
  var list = state.notes
    .filter(function(n){ return !noteSearch || (n.title+n.body).toLowerCase().indexOf(noteSearch.toLowerCase())>=0; })
    .sort(function(a,b){ return b.updated-a.updated; });
  var active = state.notes.find(function(n){ return n.id===activeNoteId; }) || list[0];
  if(active) activeNoteId = active.id;

  root.innerHTML = ''
  +'<div class="page-head">'
  +'  <div><h1>노트</h1><p>'+state.notes.length+'개의 노트 · 자동 저장</p></div>'
  +'  <button class="btn btn-solid" id="newNote"><i data-lucide="plus"></i>새 노트</button>'
  +'</div>'
  +'<div class="notes-grid">'
  +'  <div class="note-list-col">'
  +'    <input class="input" id="noteSearch" placeholder="노트 검색…" value="'+esc(noteSearch)+'" style="margin-bottom:10px">'
  +( list.length===0
    ? '<div class="empty" style="border:1px dashed var(--line);border-radius:14px;padding:34px 14px"><i data-lucide="notebook-pen"></i><b>노트가 없어요</b><p>새 노트를 만들어 기록을 쌓아보세요.</p></div>'
    : list.map(function(n){
        return '<div class="note-item '+(n.id===activeNoteId?'active':'')+'" data-note="'+n.id+'">'
          +'<b>'+esc(n.title)+'</b><span class="muted-t">'+new Date(n.updated).toLocaleDateString('ko-KR')+' · '+n.body.length+'자</span></div>';
      }).join('') )
  +'  </div>'
  +'  <div class="card note-editor" id="noteEditor">'
  +( active
    ? '<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">'
      +'<input class="input" id="noteTitle" value="'+esc(active.title)+'" style="font-weight:800;font-size:17px;border:none;padding:4px 2px">'
      +'<button class="icon-btn ic-sm" id="delNote" style="flex:none"><i data-lucide="trash-2"></i></button></div>'
      +'<textarea class="textarea" id="noteBody" placeholder="내용을 입력하세요…">'+esc(active.body)+'</textarea>'
      +'<div style="display:flex;justify-content:space-between;margin-top:10px">'
      +'<span class="save-hint" id="saveHint">편집하면 자동 저장됩니다</span>'
      +'<span class="save-hint" id="charCount">'+active.body.length+'자</span></div>'
    : '' )
  +'  </div>'
  +'</div>';

  $('#newNote').onclick = function(){
    var n = {id:uid(), title:'제목 없음', body:'', updated:Date.now()};
    state.notes.unshift(n); activeNoteId=n.id; save(); route();
    setTimeout(function(){ var t=$('#noteTitle'); if(t) t.focus(); }, 60);
  };
  $('#noteSearch').oninput = function(e){
    noteSearch=e.target.value; route();
    setTimeout(function(){ var s=$('#noteSearch'); if(s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length); } },0);
  };
  root.querySelectorAll('[data-note]').forEach(function(el){
    el.onclick = function(){ activeNoteId=el.dataset.note; route(); };
  });
  var dn = $('#delNote');
  if(dn) dn.addEventListener('click', async function(){
    if(!await askConfirm('이 노트를 삭제할까요?','삭제',true)) return;
    state.notes = state.notes.filter(function(n){ return n.id!==activeNoteId; });
    activeNoteId=null; save(); toast('노트를 삭제했어요','trash-2'); route();
  });
  function autostore(){
    var n = state.notes.find(function(x){ return x.id===activeNoteId; }); if(!n) return;
    n.title = $('#noteTitle').value || '제목 없음';
    n.body = $('#noteBody').value; n.updated = Date.now(); save();
    $('#saveHint').textContent='저장됨 ✓';
    $('#charCount').textContent = n.body.length+'자';
  }
  var nt=$('#noteTitle'), nb=$('#noteBody');
  if(nt) nt.addEventListener('input', function(){ clearTimeout(noteSaveT); noteSaveT=setTimeout(autostore,300); });
  if(nb) nb.addEventListener('input', function(){ clearTimeout(noteSaveT); noteSaveT=setTimeout(autostore,300); });
  icons();
};

  +'</div>'
  +'<div class="card">'
  +'  <h3 style="margin-bottom:12px"><i data-lucide="plus"></i>할 일 추가</h3>'
  +'  <div class="add-inline">'
  +'    <input class="input" id="todoText" placeholder="예: 수학 문제집 3단원 풀기" style="flex:2">'
  +'    <input class="input" id="todoSubj" list="subjList2" placeholder="과목 (선택)" style="flex:1">'
  +'    <datalist id="subjList2">'+subjects().map(function(s){ return '<option value="'+esc(s)+'">'; }).join('')+'</datalist>'
  +'    <input class="input" id="todoDue" type="date" style="flex:1">'
  +'    <button class="btn" id="addTodo"><i data-lucide="plus"></i>추가</button>'
  +'  </div>'
  +'</div>'
  +'<div class="section-title">할 일 목록</div>'
  +'<div class="card">'
  +( sorted.length===0
    ? '<div class="empty"><i data-lucide="list-todo"></i><b>비어 있어요</b></div>'
    : sorted.map(function(t){
        var overdue = t.due && t.due<today && !t.done;
        return '<div class="row-item" style="cursor:default">'
          +'<button class="check '+(t.done?'on':'')+'" data-tcheck="'+t.id+'"><i data-lucide="check" style="width:13px;height:13px"></i></button>'
          +'<div class="row-txt"><b class="'+(t.done?'done-txt':'')+'">'+esc(t.text)+'</b>'
          +'<span>'+esc(t.subject||'기타')+(t.due? ' · 기한 '+t.due.slice(5).replace('-','/')+(overdue?' · <b style="color:var(--fg)">기한 지남</b>':'') : '')+'</span></div>'
          +'<button class="icon-btn ic-sm" data-tdel="'+t.id+'"><i data-lucide="trash-2"></i></button></div>';
      }).join('') )
  +'</div>';
  function add(){
    var v = $('#todoText').value.trim();
    if(!v){ toast('할 일을 입력해 주세요','alert-triangle'); return; }
    state.todos.push({id:uid(), text:v, subject:$('#todoSubj').value.trim(), done:false, due:$('#todoDue').value});
    save(); toast('할 일 추가 완료'); route();
  }
  $('#addTodo').onclick = add;
  $('#todoText').addEventListener('keydown', function(e){ if(e.key==='Enter'&&!e.isComposing) add(); });
  root.querySelectorAll('[data-tcheck]').forEach(function(b){
    b.onclick = function(){
      var t = state.todos.find(function(x){ return x.id===b.dataset.tcheck; });
      t.done=!t.done; save();
      if(t.done) toast('완료','check-circle-2');
      route();
    };
  });
  root.querySelectorAll('[data-tdel]').forEach(function(b){
    b.onclick = function(){
      state.todos = state.todos.filter(function(x){ return x.id!==b.dataset.tdel; }); save(); route();
    };
  });
  icons();
};

/* ---------- 통계 ---------- */
var page_stats = function(root){
  var totalM = state.sessions.reduce(function(a,s){ return a+s.minutes; },0);
  var streak = calcStreak();
  var ws = weekStart(); var weekM=0;
  for(var i=0;i<7;i++) weekM += minutesOn(todayKey(addDays(ws,i)));
  var acc = state.quizStats.played? Math.round(state.quizStats.correct/state.quizStats.played*100):0;
  var start = addDays(weekStart(), -14*7);
  var cells='';
  for(var j=0;j<15*7;j++){
    var d = addDays(start,j), k = todayKey(d), m = minutesOn(k);
    var lv = m>=120?4 : m>=60?3 : m>=30?2 : m>0?1 : 0;
    cells += '<div class="hm-cell l'+lv+'" title="'+k.slice(5).replace('-','/')+' · '+fmtMin(m)+'"></div>';
  }
  var bySubj = {};
  state.sessions.forEach(function(s){ bySubj[s.subject]=(bySubj[s.subject]||0)+s.minutes; });
  var subjRows = Object.keys(bySubj).map(function(k){ return [k,bySubj[k]]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0,6);
  var maxS = subjRows.length? subjRows[0][1] : 1;
  var recent = state.sessions.slice().reverse().slice(0,8);
  root.innerHTML = ''
  +'<div class="page-head"><div><h1>통계</h1></div></div>'
  +'<div class="kpi-row">'
  +'  <div class="card kpi first"><span>Total Study</span><b>'+fmtMin(totalM)+'</b></div>'
  +'  <div class="card kpi"><span>연속 학습</span><b>'+streak+'일</b></div>'
  +'  <div class="card kpi"><span>이번 주</span><b>'+fmtMin(weekM)+'</b></div>'
  +'  <div class="card kpi"><span>퀴즈 정답률</span><b>'+acc+'%</b></div>'
  +'</div>'
  +'<div class="section-title">학습 히트맵 · 최근 15주</div>'
  +'<div class="card">'
  +'  <div class="hm">'+cells+'</div>'
  +'  <div class="hm-legend">적음 <i style="background:var(--hm0)"></i><i style="background:var(--hm1)"></i><i style="background:var(--hm2)"></i><i style="background:var(--hm3)"></i><i style="background:var(--hm4)"></i> 많음</div>'
  +( totalM===0? '<p class="muted-t" style="font-size:13px;text-align:center;margin-top:14px">포모도로를 완료하면 칸이 채워집니다.</p>':'' )
  +'</div>'
  +( subjRows.length
    ? '<div class="section-title">과목별 누적</div><div class="card">'
      +subjRows.map(function(r){
        return '<div class="subj-bar"><div class="sb-top"><span>'+esc(r[0])+'</span><span>'+fmtMin(r[1])+'</span></div>'
          +'<div class="track"><div class="fill" style="width:'+Math.round(r[1]/maxS*100)+'%"></div></div></div>';
      }).join('')+'</div>' : '' )
  +( recent.length
    ? '<div class="section-title">최근 기록</div><div class="card">'
      +recent.map(function(s){
        var wd = WEEKDAYS[new Date(s.date+'T00:00:00').getDay()];
        return '<div class="log-item"><span><b>'+esc(s.subject)+'</b> <span class="muted-t">· '+s.date.slice(5).replace('-','/')+' ('+wd+')</span></span>'
          +'<b>+'+s.minutes+'분</b></div>';
      }).join('')+'</div>' : '' );
  icons();
};

  +'  <button class="btn btn-ghost btn-sm" id="impBtn"><i data-lucide="upload"></i>가져오기</button>'
  +'  <button class="btn btn-danger btn-sm" id="resetBtn" style="margin-left:auto"><i data-lucide="alert-triangle"></i>전체 초기화</button>'
  +'  <input type="file" id="impFile" accept=".json" style="display:none">'
  +'</div>'
  +'<p class="muted-t" style="font-size:12px;margin-top:18px;text-align:center">StudyAll · 모든 데이터는 이 기기에만 저장됩니다</p>';

  function readModel(){
    var v = $('#setModel').value.trim().replace(/\s+/g,'');
    return v || DEFAULTS.model;
  }
  $('#saveKey').onclick = function(){
    state.apiKey = $('#setKey').value.trim();
    state.model = readModel();
    save();
    toast(state.apiKey? 'AI가 연결됐어요!' : '키가 비워졌어요 — 데모 모드로 동작', 'key-round');
    route();
  };
  $('#testKey').onclick = async function(){
    state.apiKey = $('#setKey').value.trim(); state.model = readModel(); save();
    if(!state.apiKey){ toast('키를 먼저 입력해 주세요','alert-triangle'); return; }
    toast('테스트 중…','zap');
    try{
      await groqChat([{role:'user', content:'"연결 성공"이라고만 답해줘.'}], {temperature:0});
      toast('연결 성공!','check-circle-2');
    }catch(e){ toast('실패: '+e.message,'alert-triangle'); }
  };
  $('#clearKey').onclick = function(){
    state.apiKey=''; $('#setKey').value=''; save(); toast('키를 삭제했어요','trash-2'); route();
  };
  root.querySelectorAll('[data-th]').forEach(function(b){
    b.onclick = function(){ setTheme(b.dataset.th); };
  });
  $('#installBtn').onclick = async function(){
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    var r = await deferredPrompt.userChoice;
    if(r.outcome==='accepted') toast('앱이 설치됐어요!','smartphone');
    deferredPrompt=null; route();
  };
  $('#expBtn').onclick = function(){
    var blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'studyall-backup-'+todayKey()+'.json'; a.click();
    toast('백업 파일을 저장했어요','download');
  };
  $('#impBtn').onclick = function(){ $('#impFile').click(); };
  $('#impFile').onchange = function(e){
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = async function(){
      try{
        var d = JSON.parse(r.result);
        if(typeof d!=='object'||d===null) throw new Error('형식 오류');
        if(!await askConfirm('현재 데이터를 백업 파일 내용으로 교체할까요?','가져오기',true)) return;
        state = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), d); save();
        toast('데이터를 불러왔어요','check-circle-2'); route();
      }catch(err){ toast('올바른 백업 파일이 아니에요','alert-triangle'); }
    };
    r.readAsText(f);
  };
  $('#resetBtn').onclick = async function(){
    if(!await askConfirm('모든 학습 데이터가 영구 삭제됩니다. 계속할까요?','전체 삭제',true)) return;
    localStorage.removeItem(STORE_KEY); location.reload();
  };
  icons();
};

var PAGES = { home:page_home, tutor:page_tutor, tools:page_tools, cards:page_cards, quiz:page_quiz,
  timer:page_timer, notes:page_notes, planner:page_planner, stats:page_stats, settings:page_settings };

/* ---------- PWA ---------- */
(function initPWA(){
  var icon = 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#0a0a0a"/><text x="256" y="352" font-family="Arial,Helvetica,sans-serif" font-size="290" font-weight="900" fill="#ffffff" text-anchor="middle">S</text></svg>');
  var manifest = {
    name:'StudyAll — 학습 워크스페이스', short_name:'StudyAll',
    description:'AI 튜터, 플래시카드, 퀴즈, 포모도로를 한 앱에서.',
    start_url: location.pathname, scope:'./', display:'standalone', orientation:'portrait',
    background_color:'#ffffff', theme_color:'#0a0a0a',
    icons:[
      {src:icon, sizes:'192x192', type:'image/svg+xml', purpose:'any'},
      {src:icon, sizes:'512x512', type:'image/svg+xml', purpose:'any maskable'},
    ]
  };
  try{
    var link = document.createElement('link');
    link.rel='manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'}));
    document.head.appendChild(link);
  }catch(e){}
  if('serviceWorker' in navigator && location.protocol==='https:'){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();

/* ---------- 부팅 ---------- */
buildShell();
setTheme(state.theme);
pomoReset();
if(!location.hash) location.hash = '#/home';
route();
</script>
</body>
</html>
